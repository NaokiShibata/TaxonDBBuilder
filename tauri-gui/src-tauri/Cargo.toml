[package]
name = "taxondbbuilder-gui"
version = "3.4.0"
description = "TaxonDBBuilder GUI (Tauri)"
authors = ["TaxonDBBuilder contributors"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["clock", "serde"] }
open = "5"
# Default (xdg-portal) backend: proven non-blocking on the Tauri UI thread.
# Replace confirmations use an in-app dialog instead of rfd message dialogs.
rfd = "0.15"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
toml = "1"
