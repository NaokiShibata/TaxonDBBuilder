# Marker definitions for full mitochondrial genomes and individual regions.

[markers."complete"]
full_record = true
aliases = ["full", "full mitogenome", "complete mitogenome"]
phrases = [
  "mitochondrion",
  "complete mitochondrial genome",
  "mitochondrial DNA, complete genome",
  "mitochondrion, complete genome",
  "mitochondrion complete genome",
]
region_patterns = []
feature_types = []
feature_fields = ["gene"]
header_format = "mifish_pipeline"

[markers."mitogenome"]
fallback = "mitogenome"
fallback_targets = [
  "12S",
  "16S",
  "COI",
  "COII",
  "COIII",
  "CYTB",
  "ATP6",
  "ATP8",
  "ND1",
  "ND2",
  "ND3",
  "ND4",
  "ND4L",
  "ND5",
  "ND6",
  "control_region",
]
